<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Display Control</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 20px;
    text-align: center;
  }
  .card {
    background: #1c1c1e;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .card h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #999;
    margin: 0 0 14px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #bbb;
    margin: 10px 0 4px;
  }
  input[type="color"] {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 8px;
    background: none;
    padding: 0;
  }
  input[type="range"] { width: 100%; }
  input[type="text"], textarea {
    width: 100%;
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    padding: 10px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row span { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: #aaa; width: 3em; text-align: right; }
  .swatch {
    margin-top: 14px;
    height: 60px;
    border-radius: 10px;
    border: 1px solid #3a3a3c;
    background-image:
      linear-gradient(45deg, #444 25%, transparent 25%),
      linear-gradient(-45deg, #444 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #444 75%),
      linear-gradient(-45deg, transparent 75%, #444 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  .swatch-fill { width: 100%; height: 100%; border-radius: 10px; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #0a84ff;
    color: #fff;
    cursor: pointer;
  }
  button:active { background: #0069d9; }
  .status {
    text-align: center;
    font-size: 0.8rem;
    color: #7cd992;
    height: 1.2em;
    margin-top: 8px;
    transition: opacity 0.3s;
  }
  .status.hidden { opacity: 0; }
</style>
</head>
<body>
  <h1>Content Display &mdash; Remote Control</h1>

  <div class="card">
    <h2>Erase Color</h2>
    <label for="rgb">Color</label>
    <input type="color" id="rgb" value="#000000" />
    <div class="row">
      <label style="flex:1; margin:10px 0 0;" for="alpha">Alpha</label>
      <span id="alphaVal">0.00</span>
    </div>
    <input type="range" id="alpha" min="0" max="1" step="0.01" value="0" />
    <div class="swatch"><div class="swatch-fill" id="swatch"></div></div>
    <button id="saveColor">Save Erase Color</button>
    <div class="status hidden" id="colorStatus">Saved</div>
  </div>

  <div class="card">
    <h2>Coffee Hour Text</h2>
    <label for="coffeeText">Message</label>
    <textarea id="coffeeText" rows="3"></textarea>
    <button id="saveCoffee">Save Coffee Hour Text</button>
    <div class="status hidden" id="coffeeStatus">Saved</div>
  </div>

  <script>
    const rgbInput = document.getElementById('rgb');
    const alphaInput = document.getElementById('alpha');
    const alphaVal = document.getElementById('alphaVal');
    const swatch = document.getElementById('swatch');
    const coffeeText = document.getElementById('coffeeText');

    function hexToRgb01(hex) {
      const n = parseInt(hex.slice(1), 16);
      return {
        r: ((n >> 16) & 255) / 255,
        g: ((n >> 8) & 255) / 255,
        b: (n & 255) / 255,
      };
    }

    function rgb01ToHex(r, g, b) {
      const to255 = (v) => Math.round(v * 255).toString(16).padStart(2, '0');
      return `#${to255(r)}${to255(g)}${to255(b)}`;
    }

    function updateSwatch() {
      const { r, g, b } = hexToRgb01(rgbInput.value);
      const a = parseFloat(alphaInput.value);
      swatch.style.background = `rgba(${Math.round(r*255)}, ${Math.round(g*255)}, ${Math.round(b*255)}, ${a})`;
      alphaVal.textContent = a.toFixed(2);
    }

    function flashStatus(el) {
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 1500);
    }

    async function loadState() {
      const res = await fetch('/api/state');
      const state = await res.json();
      const { r, g, b, a } = state.eraseColor;
      rgbInput.value = rgb01ToHex(r, g, b);
      alphaInput.value = a;
      coffeeText.value = state.coffeeHourText;
      updateSwatch();
    }

    rgbInput.addEventListener('input', updateSwatch);
    alphaInput.addEventListener('input', updateSwatch);

    document.getElementById('saveColor').addEventListener('click', async () => {
      const { r, g, b } = hexToRgb01(rgbInput.value);
      const a = parseFloat(alphaInput.value);
      await fetch('/api/erase-color', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ r, g, b, a }),
      });
      flashStatus(document.getElementById('colorStatus'));
    });

    document.getElementById('saveCoffee').addEventListener('click', async () => {
      await fetch('/api/coffee-hour', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: coffeeText.value }),
      });
      flashStatus(document.getElementById('coffeeStatus'));
    });

    loadState();
  </script>
</body>
</html>
